<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقييمات كيميت - Review</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #050505;
            color: white;
            margin: 0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

       
        .nav-fixed {
            position: fixed;
            top: 20px;
            right: 5%;
            z-index: 1000;
        }

        .home-btn {
            background: rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(10px);
            color: #d4af37;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            font-weight: bold;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #d4af37;
            color: #000;
        }

        
        .review-slide {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            opacity: 0; /* البداية مخفية */
            transform: translateY(30px);
            animation: fadeInSlide 1.5s ease-out forwards;
        }

        
        .review-slide:nth-child(2) { animation-delay: 0.3s; }
        .review-slide:nth-child(3) { animation-delay: 0.8s; }

        @keyframes fadeInSlide {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 25px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            width: 85%;
            max-width: 600px;
            text-align: center;
            z-index: 2;
        }

        .bg-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.3);
        }

        
        .stars {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            gap: 10px;
            margin: 25px 0;
        }

        .stars input { display: none; }
        .stars label {
            font-size: 45px;
            color: #444;
            cursor: pointer;
            transition: 0.3s;
        }

        .stars label:hover,
        .stars label:hover ~ label,
        .stars input:checked ~ label {
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        textarea {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            resize: none;
        }

        .submit-btn {
            background: #d4af37;
            color: black;
            border: none;
            padding: 15px 45px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            transition: 0.3s;
        }

        .submit-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <div class="nav-fixed">
        <a href="kemet.html" class="home-btn">الرئيسية (Home)</a>
    </div>

    <section class="review-slide">
        <img src="C:\Users\Administrator\Desktop\kemet\waa-towaw-WEgu2KuFBs0-unsplash.jpg" class="bg-img"> <div class="glass-card">
            <h1 style="color: #d4af37; font-size: 3rem;">ماذا يقول زوارنا؟</h1>    
            <p style="font-size: 1.2rem; line-height: 1.6;">آراؤكم تساعدنا على تقديم تجربة أفضل لاستكشاف أسرار مصر القديمة.</p>
        </div>
    </section>

    <section class="review-slide">
        <div class="glass-card">
            <h2 style="color: #d4af37;">شاركنا تجربتك</h2>
            <div class="stars">
                <input type="radio" id="s5" name="star" value="5"><label for="s5">★</label>
                <input type="radio" id="s4" name="star" value="4"><label for="s4">★</label>
                <input type="radio" id="s3" name="star" value="3"><label for="s3">★</label>
                <input type="radio" id="s2" name="star" value="2"><label for="s2">★</label>
                <input type="radio" id="s1" name="star" value="1"><label for="s1">★</label>
            </div>

            <textarea id="reviewText" rows="4" placeholder="اكتب تعليقك هنا..."></textarea>
            <button class="submit-btn" onclick="sendReview()">نشر المراجعة</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
